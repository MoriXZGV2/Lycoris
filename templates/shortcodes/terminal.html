<div class="term-window" role="group" aria-label="terminal interaktif">
  <div class="term-bar">Mori@LycorisRadiata: ~</div>
  <div class="term-screen" tabindex="0"></div>
  <div class="term-input-row">
    <span class="term-prompt">[<span class="tp-user">Mori</span><span class="tp-at">@</span><span class="tp-host">LycorisRadiata</span> <span class="tp-path">~</span>]$</span>
    <input type="text" class="term-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="perintah terminal" disabled />
  </div>
</div>
<p class="term-hint">Ketik <code>help</code>, lalu tekan <kbd>Enter</kbd>.</p>
<script>
(function () {
  'use strict';
  var root = document.currentScript;
  var term = root.parentElement.querySelector('.term-window');
  var screen = term.querySelector('.term-screen');
  var input = term.querySelector('.term-input');
  var promptPath = term.querySelector('.term-prompt .tp-path');

  var files = {
    '~/Stress.md': 'Jujur, hari ini aku capek banget. Asli, rasanya udah lah — kayak gitu terus. Obatku cuma musikku, sama menulis blog.',
    '~/Blog/motto.md': 'Amor fati — cintai apa yang terjadi, termasuk hari ini.',
    '~/Musik/relaksasi.mp3': 'relaksasi.mp3 — 3:33 — mainkan saat dunia terasa bising.'
  };
  var dirs = {
    '~': ['Blog', 'Musik', 'Stress.md'],
    '~/Blog': ['motto.md'],
    '~/Musik': ['relaksasi.mp3']
  };
  var mottos = [
    'Dubito, ergo cogito, ergo sum.',
    'Memento mori, memento vivere.',
    'Labor omnia vincit improbus.',
    'Amor fati.',
    'Sic itur ad astra.',
    'Audentes fortuna iuvat.'
  ];

  var cwd = '~';
  var history = [];
  var hIdx = -1;
  var skip = false;

  function u(t) { return '<span class="tp-user">' + t + '</span>'; }
  function a(t) { return '<span class="tp-at">' + t + '</span>'; }
  function h(t) { return '<span class="tp-host">' + t + '</span>'; }
  function p(t) { return '<span class="tp-path">' + t + '</span>'; }

  function promptMarkup() {
    return '[' + u('Mori') + a('@') + h('LycorisRadiata') + ' ' + p(cwd) + ']$ ';
  }

  function esc(t) {
    return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function scroll() { screen.scrollTop = screen.scrollHeight; }

  function printOut(text, cls) {
    if (text === null || text === undefined || text === '') { scroll(); return; }
    var div = document.createElement('div');
    div.className = 'term-out' + (cls ? ' ' + cls : '');
    div.innerHTML = esc(text);
    screen.appendChild(div);
    scroll();
  }

  function printCmdLine(cmd) {
    var div = document.createElement('div');
    div.className = 'term-out';
    div.innerHTML = promptMarkup() + esc(cmd);
    screen.appendChild(div);
    scroll();
  }

  function normalize(arg) {
    var base = arg.charAt(0) === '~' ? '~' : cwd;
    var rest = arg.charAt(0) === '~' ? arg.slice(1) : arg;
    var segs = (base + '/' + rest).split('/');
    var parts = [];
    for (var i = 0; i < segs.length; i++) {
      var s = segs[i];
      if (!s || s === '.') { continue; }
      if (s === '..') { parts.pop(); } else { parts.push(s); }
    }
    return parts.length ? parts.join('/') : '~';
  }

  var commands = {
    help: function () {
      printOut('Perintah yang tersedia:\n' +
        '  whoami        siapa kamu\n' +
        '  pwd           direktori saat ini\n' +
        '  ls [dir]      daftar isi direktori\n' +
        '  cd <dir>      pindah direktori\n' +
        '  cat <file>    baca isi file\n' +
        '  touch <file>  buat file baru\n' +
        '  rm <file>     hapus file\n' +
        '  echo <teks>   ulangi teks\n' +
        '  date          tanggal hari ini\n' +
        '  motto         kutipan hari ini\n' +
        '  neofetch      info sistem\n' +
        '  clear         bersihkan layar\n' +
        '  exit          keluar terminal');
    },
    whoami: function () { printOut('Mori'); },
    pwd: function () { printOut(cwd); },
    ls: function (args) {
      var target = args.length ? normalize(args[0]) : cwd;
      if (files[target] !== undefined) { printOut(target.split('/').pop()); return; }
      var list = dirs[target];
      if (!list) { printOut('ls: cannot access ' + args[0] + ': No such file or directory'); return; }
      printOut(list.join('   '));
    },
    cd: function (args) {
      if (!args.length) { cwd = '~'; }
      else {
        var t = normalize(args[0]);
        if (dirs[t]) { cwd = t; }
        else { printOut('cd: ' + args[0] + ': No such directory'); return; }
      }
      promptPath.textContent = cwd;
    },
    cat: function (args) {
      if (!args.length) { printOut('cat: missing operand — ketik cat <nama file>'); return; }
      var t = normalize(args[0]);
      if (files[t] !== undefined) { printOut(files[t]); }
      else if (dirs[t]) { printOut('cat: ' + args[0] + ': Is a directory'); }
      else { printOut('cat: ' + args[0] + ': No such file'); }
    },
    touch: function (args) {
      if (!args.length) { printOut('touch: missing file operand'); return; }
      var name = args[0];
      var t = cwd + '/' + name;
      if (dirs[cwd].indexOf(name) === -1) {
        dirs[cwd].push(name);
        files[t] = '';
      }
    },
    rm: function (args) {
      if (!args.length) { printOut('rm: missing operand'); return; }
      var name = args[0];
      var t = cwd + '/' + name;
      if (name === 'Stress.md' || t === '~/Stress.md') {
        printOut('rm: cannot remove ' + name + ': Permission denied', 'dim');
        printOut('   Stress.md adalah file sistem yang penting. Maaf.');
        return;
      }
      var idx = dirs[cwd].indexOf(name);
      if (idx === -1) { printOut('rm: cannot remove ' + name + ': No such file'); return; }
      dirs[cwd].splice(idx, 1);
      delete files[t];
    },
    echo: function (args) { printOut(args.join(' ')); },
    date: function () { printOut(new Date().toString()); },
    motto: function () { printOut(mottos[Math.floor(Math.random() * mottos.length)]); },
    clear: function () { screen.innerHTML = ''; },
    exit: function () { printOut('Mau keluar? Kan masih ada cerita yang belum selesai.'); },
    sudo: function () { printOut('Mori: sudo tidak ada di sini. Cukup jadi diri sendiri.'); },
    neofetch: function () {
      printOut('Mori@LycorisRadiata\n' +
        'OS: sebuah hati yang sedang berjalan\n' +
        'Shell: jujur\n' +
        'Uptime: 22 jam, dan tetap bertahan');
    }
  };

  function run(cmd) {
    printCmdLine(cmd);
    var parts = cmd.trim().split(/\s+/);
    var name = parts[0];
    var args = parts.slice(1);
    if (!name) { return; }
    var fn = commands[name];
    if (fn) { fn(args); }
    else { printOut('zsh: command not found: ' + name); }
  }

  function onEnter() {
    var cmd = input.value;
    input.value = '';
    history.push(cmd);
    hIdx = history.length;
    run(cmd);
  }

  function typing(el, text, ms, done) {
    var i = 0;
    (function step() {
      if (skip || i >= text.length) {
        el.textContent = text;
        if (done) { done(); }
        return;
      }
      i += 1;
      el.textContent = text.slice(0, i);
      scroll();
      setTimeout(step, ms);
    })();
  }

  var boot = [
    { out: 'Lycoris Radiata 3.14 (tty1)' },
    { out: '[ ok ] Memuat filesystem' },
    { out: '[ ok ] Memulai musik-player' },
    { out: '[ ok ] Memulai blogd' },
    { out: '' },
    { cmd: 'whoami', out: 'Mori' },
    { cmd: 'touch Stress.md', out: null },
    { cmd: 'ls', out: 'Blog/   Musik/   Stress.md' },
    { cmd: 'cat > Stress.md <<EOF', out: files['~/Stress.md'] },
    { out: 'EOF', dim: true }
  ];

  function runBoot() {
    var i = 0;
    function next() {
      if (skip || i >= boot.length) { finish(); return; }
      var step = boot[i];
      i += 1;
      if (step.cmd != null) {
        var div = document.createElement('div');
        div.className = 'term-out';
        div.innerHTML = promptMarkup();
        var span = document.createElement('span');
        div.appendChild(span);
        screen.appendChild(div);
        typing(span, step.cmd, 26, function () {
          if (step.out !== null) { printOut(step.out); }
          setTimeout(next, 220);
        });
      } else {
        printOut(step.out, step.dim ? 'dim' : null);
        setTimeout(next, step.out === '' ? 100 : 300);
      }
    }
    next();
  }

  function finish() {
    input.disabled = false;
    input.focus();
  }

  function skipAll() { skip = true; }

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); onEnter(); }
    else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (hIdx > 0) { hIdx -= 1; input.value = history[hIdx]; }
    }
    else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (hIdx < history.length - 1) { hIdx += 1; input.value = history[hIdx]; }
      else { hIdx = history.length; input.value = ''; }
    }
  });

  term.addEventListener('mousedown', function () { input.focus(); });

  document.addEventListener('keydown', skipAll, true);
  document.addEventListener('mousedown', skipAll, true);

  runBoot();
})();
</script>
